<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>HAAV — Academic Management System | Aditya University</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--p:#4f46e5;--pd:#4338ca;--pl:#eef2ff;--sb:#1e293b;--bg:#f8fafc;--bd:#e2e8f0;--tx:#1e293b;--mu:#64748b;--ok:#16a34a;--okb:#f0fdf4;--okr:#bbf7d0;--wn:#d97706;--wnb:#fffbeb;--wnr:#fcd34d;--er:#dc2626;--erb:#fef2f2;--err:#fca5a5;--in:#2563eb;--inb:#eff6ff;--inr:#bfdbfe;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--tx);font-size:14px;line-height:1.5;background:var(--bg);}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
#haav{min-height:100vh;}
.app{display:flex;min-height:100vh;}
/* Sidebar */
.sb{width:236px;background:var(--sb);position:fixed;left:0;top:0;bottom:0;display:flex;flex-direction:column;z-index:200;overflow-y:auto;transition:transform .25s;}
.sb::-webkit-scrollbar{width:0;}
.sb-brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.07);}
.sb-logo{font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.5px;}
.sb-sub{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
.sb-inst{font-size:11px;color:#475569;margin-top:8px;line-height:1.4;}
.sb-nav{flex:1;padding:8px;}
.nb{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:none;background:none;color:#94a3b8;cursor:pointer;border-radius:8px;font-size:13px;font-weight:500;text-align:left;transition:all .15s;margin-bottom:1px;}
.nb:hover{background:rgba(255,255,255,.06);color:#e2e8f0;}
.nb.act{background:var(--p);color:#fff;}
.nb-badge{margin-left:auto;background:var(--er);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9999px;}
.sb-foot{padding:10px 8px;border-top:1px solid rgba(255,255,255,.07);}
.uchip{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.05);border-radius:8px;}
.uav{width:34px;height:34px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.un{font-size:13px;color:#e2e8f0;font-weight:500;}
.uid{font-size:11px;color:#64748b;}
.sb-ovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199;}
/* Main */
.mc{margin-left:236px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:#fff;border-bottom:1px solid var(--bd);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.tb-l{display:flex;align-items:center;gap:12px;}
.pg-title{font-size:16px;font-weight:600;}
.hmb{display:none;background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;color:var(--mu);font-size:18px;}
.tb-r{display:flex;align-items:center;gap:8px;}
.notif-btn{position:relative;padding:7px;border-radius:8px;background:var(--bg);border:1px solid var(--bd);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:16px;}
.notif-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--er);border:1.5px solid #fff;}
.logout-btn{padding:7px 14px;background:var(--bg);border:1px solid var(--bd);color:var(--mu);font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;transition:all .15s;}
.logout-btn:hover{background:var(--erb);color:var(--er);border-color:var(--err);}
.pa{flex:1;padding:24px;max-width:1280px;width:100%;}
/* Cards */
.card{background:#fff;border-radius:10px;border:1px solid var(--bd);box-shadow:0 1px 3px rgba(0,0,0,.04);}
.ch{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.ct{font-size:14px;font-weight:600;}
.cb{padding:20px;}
/* Stats */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
.sc{background:#fff;border-radius:10px;border:1px solid var(--bd);padding:16px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:box-shadow .15s;}
.sc:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);}
.sl{font-size:11px;color:var(--mu);font-weight:500;margin-bottom:6px;}
.sv{font-size:26px;font-weight:800;line-height:1;color:var(--tx);}
.ss{font-size:11px;color:var(--mu);margin-top:4px;}
/* Badges */
.bd2{display:inline-flex;align-items:center;padding:3px 9px;border-radius:9999px;font-size:11px;font-weight:600;}
.bs{background:var(--okb);color:var(--ok);border:1px solid var(--okr);}
.bw{background:var(--wnb);color:var(--wn);border:1px solid var(--wnr);}
.be{background:var(--erb);color:var(--er);border:1px solid var(--err);}
.bi{background:var(--inb);color:var(--in);border:1px solid var(--inr);}
.bn{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;font-family:inherit;}
.btn-p{background:var(--p);color:#fff;}
.btn-p:hover{background:var(--pd);}
.btn-s{background:#fff;color:var(--tx);border:1px solid var(--bd);}
.btn-s:hover{background:var(--bg);}
.btn-g{background:var(--ok);color:#fff;}
.btn-g:hover{background:#15803d;}
.btn-e{background:var(--er);color:#fff;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
/* Forms */
.fg{margin-bottom:14px;}
.fl{display:block;font-size:13px;font-weight:500;color:var(--tx);margin-bottom:5px;}
.fi,.fs,.fta{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;color:var(--tx);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit;}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(79,70,229,.1);}
.fta{resize:vertical;min-height:80px;}
/* Tables */
.tc{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{padding:10px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;background:#f8fafc;border-bottom:1px solid var(--bd);}
tbody td{padding:11px 16px;border-bottom:1px solid #f1f5f9;font-size:13px;color:var(--tx);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#fafbff;}
/* Attendance bar */
.ab{height:8px;border-radius:4px;background:#f1f5f9;overflow:hidden;}
.af{height:100%;border-radius:4px;transition:width .5s;}
.af-ok{background:#22c55e;}
.af-wn{background:#f59e0b;}
.af-er{background:#ef4444;}
/* Alerts */
.alert{display:flex;gap:12px;padding:12px 16px;border-radius:10px;margin-bottom:12px;}
.al-e{background:var(--erb);border:1px solid var(--err);color:var(--er);}
.al-w{background:var(--wnb);border:1px solid var(--wnr);color:#92400e;}
.al-s{background:var(--okb);border:1px solid var(--okr);color:var(--ok);}
.al-i{background:var(--inb);border:1px solid var(--inr);color:var(--in);}
.ai{flex-shrink:0;font-size:16px;}
.atx .atl{font-weight:600;font-size:13px;}
.atx .ads{font-size:12px;margin-top:2px;opacity:.85;}
/* Modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.md{background:#fff;border-radius:14px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2);}
.mh{padding:20px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.mtt{font-size:16px;font-weight:600;}
.mx{width:32px;height:32px;border-radius:8px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--mu);}
.mb2{padding:24px;}
.mf{padding:16px 24px;border-top:1px solid var(--bd);display:flex;gap:10px;justify-content:flex-end;}
/* Toast */
#tr{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.to{padding:12px 16px;border-radius:10px;min-width:260px;max-width:360px;display:flex;align-items:flex-start;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:13px;font-weight:500;animation:tIn .2s ease;background:#fff;}
.to-s{border-left:4px solid var(--ok);}
.to-e{border-left:4px solid var(--er);}
.to-w{border-left:4px solid var(--wn);}
.to-i{border-left:4px solid var(--in);}
@keyframes tIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
/* Tabs */
.tabs{display:flex;gap:2px;background:#f1f5f9;padding:3px;border-radius:10px;margin-bottom:20px;max-width:420px;}
.tab{flex:1;padding:7px 12px;border:none;background:none;color:var(--mu);font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;transition:all .15s;font-family:inherit;}
.tab.act{background:#fff;color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.1);}
/* Login */
.lp{min-height:100vh;display:flex;background:var(--bg);}
.ll{width:360px;background:var(--sb);display:flex;flex-direction:column;padding:44px 32px;color:#fff;flex-shrink:0;}
.lr{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;}
.lfc{background:#fff;border-radius:16px;padding:36px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,.08);border:1px solid var(--bd);}
.llogo{font-size:28px;font-weight:800;color:#fff;letter-spacing:-0.5px;}
.lsub{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.1em;margin-top:3px;}
.pww{position:relative;}
.pwtg{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--mu);font-size:15px;padding:4px;}
.demo-box{background:var(--inb);border:1px solid var(--inr);border-radius:8px;padding:12px 14px;margin-top:16px;font-size:12px;color:#1e40af;}
/* Timetable */
.tg{display:grid;gap:3px;}
.tth,.ttm{padding:8px 6px;background:#f8fafc;font-size:11px;font-weight:600;color:var(--mu);text-align:center;border-radius:6px;}
.ttc{padding:6px;border-radius:6px;border:1px solid var(--bd);background:#fff;min-height:58px;}
.ttcl{background:var(--inb);border-color:var(--inr);border-radius:6px;padding:5px 6px;}
.ttcl.lab{background:#f0fdf4;border-color:var(--okr);}
.ttcn{font-size:11px;font-weight:700;color:var(--p);line-height:1.2;}
.ttcl.lab .ttcn{color:var(--ok);}
.ttcd{font-size:10px;color:var(--mu);margin-top:1px;}
/* Profile */
.ph{background:linear-gradient(135deg,var(--sb) 0%,#334155 100%);padding:28px;display:flex;gap:20px;align-items:center;color:#fff;}
.pav{width:72px;height:72px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex-shrink:0;border:3px solid rgba(255,255,255,.2);}
.pn{font-size:20px;font-weight:700;}
.pr{font-size:13px;color:#94a3b8;margin-top:3px;}
.pbg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.pb{padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600;background:rgba(255,255,255,.1);color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.15);}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.il .ilb{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;}
.il .ilv{font-size:14px;color:var(--tx);margin-top:3px;font-weight:500;}
/* Fees */
.fr{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:13px;}
.fr:last-child{border-bottom:none;}
.fr-t{font-weight:700;font-size:15px;}
.fr-pd{color:var(--ok);}
.fr-pe{color:var(--er);font-weight:600;}
/* Payment */
.pmb{border:2px solid var(--bd);border-radius:10px;padding:14px 16px;cursor:pointer;width:100%;background:#fff;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;color:var(--tx);text-align:left;margin-bottom:10px;font-family:inherit;transition:all .15s;}
.pmb:hover,.pmb.sel{border-color:var(--p);background:var(--pl);}
/* Receipt */
.rc{border:2px dashed var(--bd);border-radius:14px;padding:24px;text-align:center;background:#fafbff;}
.rcl{font-size:22px;font-weight:800;color:var(--p);}
.rcr{background:var(--wnb);border:1px solid var(--wnr);border-radius:6px;padding:8px 12px;font-size:11px;color:#92400e;margin-top:12px;}
/* Announcement */
.an{border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:12px;background:#fff;border-left-width:4px;}
.an-u{border-left-color:var(--er);}
.an-i{border-left-color:var(--wn);}
.an-n{border-left-color:#94a3b8;}
/* Att marking */
.amr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #f1f5f9;}
.amr:last-child{border-bottom:none;}
.rg{display:flex;gap:16px;}
.rl{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:600;}
.rl input{accent-color:var(--p);}
/* Marks input */
.mi{width:60px;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;font-size:13px;text-align:center;outline:none;}
.mi:focus{border-color:var(--p);box-shadow:0 0 0 2px rgba(79,70,229,.15);}
/* Timeline */
.tl{display:flex;flex-direction:column;gap:0;}
.tli{display:flex;gap:16px;}
.tld{display:flex;flex-direction:column;align-items:center;}
.tldot{width:12px;height:12px;border-radius:50%;background:var(--p);flex-shrink:0;margin-top:4px;}
.tlline{width:2px;flex:1;background:var(--bd);margin-top:4px;}
.tlc{flex:1;padding-bottom:20px;}
/* Grade colors */
.gO{color:var(--p);font-weight:700;}
.gAp{color:var(--ok);font-weight:700;}
.gA{color:var(--ok);font-weight:700;}
.gBp{color:var(--in);font-weight:700;}
.gB{color:var(--in);font-weight:700;}
.gC{color:var(--wn);font-weight:700;}
.gF{color:var(--er);font-weight:700;}
/* Grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
/* Subject card for registration */
.scc{border:2px solid var(--bd);border-radius:10px;padding:13px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s;background:#fff;margin-bottom:10px;}
.scc:hover,.scc.sel{border-color:var(--p);}
.scc.sel{background:var(--pl);}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid #d1d5db;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;transition:all .15s;}
.chk.on{background:var(--p);border-color:var(--p);color:#fff;}
/* Spinner */
.spin{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.lc{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:60px 0;}
/* Divider */
.dv{height:1px;background:var(--bd);margin:20px 0;}
/* Responsive */
@media(max-width:768px){
  .sb{transform:translateX(-100%);}
  .sb.open{transform:translateX(0);}
  .mc{margin-left:0;}
  .hmb{display:flex;}
  .sb-ovl.open{display:block;}
  .ll{display:none;}
  .lr{padding:20px;}
  .lfc{padding:28px 22px;}
  .sg{grid-template-columns:1fr 1fr;}
  .pa{padding:16px;}
  .topbar{padding:0 16px;}
  .g2{grid-template-columns:1fr;}
  .g3{grid-template-columns:1fr 1fr;}
  .ig{grid-template-columns:1fr;}
  .ph{flex-direction:column;text-align:center;}
}
@media(max-width:480px){.g3{grid-template-columns:1fr;}.sg{grid-template-columns:1fr 1fr;}}
</style>
</head>

const Auth={
  login(id,pwd){
    const stus=DB.get('students')||_STU;
    const facs=DB.get('faculty')||_F;
    const uid=id.trim().toUpperCase();
    if(/^[0-9]/.test(uid)){
      const s=stus.find(x=>x.roll===uid);
      if(!s)return{ok:false,msg:'Roll number not found. Check your institutional ID.'};
      if(s.pwd!==pwd)return{ok:false,msg:'Incorrect password. Please try again.'};
      return{ok:true,role:'student',user:s};
    } else if(/^AU-FAC-/i.test(uid)){
      const f=facs.find(x=>x.fid===uid);
      if(!f)return{ok:false,msg:'Faculty ID not found in the system.'};
      if(f.pwd!==pwd)return{ok:false,msg:'Incorrect password.'};
      return{ok:true,role:'faculty',user:f};
    }
    return{ok:false,msg:'Unrecognised identifier format. Students use Roll Number; Faculty use Faculty ID (AU-FAC-XXX).'};
  },
  save(role,user){DB.set('session',{role,id:role==='student'?user.roll:user.fid});},
  load(){
    const s=DB.get('session');if(!s)return null;
    if(s.role==='student'){const u=(DB.get('students')||_STU).find(x=>x.roll===s.id);return u?{role:'student',user:u}:null;}
    if(s.role==='faculty'){const u=(DB.get('faculty')||_F).find(x=>x.fid===s.id);return u?{role:'faculty',user:u}:null;}
    return null;
  },
  logout(){DB.set('session',null);APP.user=null;APP.role=null;APP.pg='dashboard';render();}
};

const att_pct=(a,c)=>c?+((a/c)*100).toFixed(1):0;
const att_st=p=>p>=80?'safe':p>=75?'near':'short';
const att_need=(a,c,t=75)=>{const p=att_pct(a,c);if(p>=t)return 0;return Math.max(0,Math.ceil((t/100*c-a)/(1-t/100)));};
function grp(m,mx){const p=(m/mx)*100;if(p>=90)return{g:'O',gp:10};if(p>=80)return{g:'A+',gp:9};if(p>=70)return{g:'A',gp:8};if(p>=60)return{g:'B+',gp:7};if(p>=50)return{g:'B',gp:6};if(p>=40)return{g:'C',gp:5};return{g:'F',gp:0};}
function gcls(g){const m={O:'gO','A+':'gAp',A:'gA','B+':'gBp',B:'gB',C:'gC',F:'gF'};return m[g]||'';}
function fdate(d){if(!d)return'–';const dt=new Date(d);return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function fcur(n){return'₹'+Number(n).toLocaleString('en-IN');}
function ini(nm){return nm.split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();}
function gS(id){return _S.find(s=>s.id===id)||{name:id,code:id};}
function gF(id){return(_F.find(f=>f.id===id)||{});}
function gD(id){return(_D.find(d=>d.id===id)||{});}
function gP(id){return(_P.find(p=>p.id===id)||{});}
function ord(n){return n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th';}
function rom(n){return['','I','II','III','IV','V','VI','VII','VIII'][n]||n;}
function greet(){const h=new Date().getHours();return h<12?'morning':h<17?'afternoon':'evening';}
function dcharts(){Object.values(APP.charts).forEach(c=>{try{c.destroy();}catch{}});APP.charts={};}

// ── TOAST ──────────────────────────────
function toast(msg,tp='success'){
  const id='t'+Date.now();
  const ic={success:'✓',error:'✕',warning:'⚠',info:'ℹ'};
  const el=document.createElement('div');
  el.id=id;el.className=`to to-${tp}`;
  el.innerHTML=`<span>${ic[tp]||'•'}</span><span>${msg}</span>`;
  document.getElementById('tr').appendChild(el);
  setTimeout(()=>{const e=document.getElementById(id);if(e)e.remove();},3500);
}

function togglePwd(){const i=document.getElementById('lpwd');if(i)i.type=i.type==='password'?'text':'password';}
function doLogin(){
  const id=(document.getElementById('lid')?.value||'').trim();
  const pwd=document.getElementById('lpwd')?.value||'';
  const err=document.getElementById('lerr');
  const btn=document.getElementById('lbtn');
  if(!id||!pwd){if(err){err.textContent='Please enter your ID and password.';err.style.display='block';}return;}
  if(btn){btn.textContent='Signing in…';btn.disabled=true;}
  setTimeout(()=>{
    const r=Auth.login(id,pwd);
    if(r.ok){Auth.save(r.role,r.user);APP.user=r.user;APP.role=r.role;APP.pg='dashboard';render();}
    else{if(err){err.textContent=r.msg;err.style.display='block';}if(btn){btn.textContent='Sign In';btn.disabled=false;}}
  },500);
}

function saveAtt(){

      <div class="dv"></div>
      <h3 style="font-size:14px;font-weight:600;margin-bottom:14px;">Assigned Subjects</h3>
      ${ms.map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;"><div><div style="font-weight:600;">${s.name}</div><div style="font-size:11px;color:var(--mu);">${s.code} · ${s.credits} Cr</div></div><span class="bd2 ${s.type==='lab'?'bs':'bi'}">${s.type==='lab'?'LAB':'THEORY'}</span></div>`).join('')}
    </div>
  </div>`;
}

// ═══════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════
function render(){
  const root=document.getElementById('haav');if(!root)return;
  if(!APP.user){renderLogin();return;}
  const pgmap_s={dashboard:pgDashboard,profile:pgProfile,att:pgAtt,perf:pgPerf,exams:pgExams,tt:pgTT,fees:pgFees,reg:pgReg,backlogs:pgBacklogs,history:pgHistory,ann:pgAnn,notif:pgNotif,settings:pgSettings};
  const pgmap_f={dashboard:pgFDash,fclasses:pgFClasses,fstus:pgFStus,fatt:pgFAtt,fmarks:pgFMarks,fexams:pgFExams,ftt:pgFTT,fann:pgAnn,fprofile:pgFProfile,notif:pgNotif};
  const pgmap=APP.role==='student'?pgmap_s:pgmap_f;
  const fn=pgmap[APP.pg]||(APP.role==='student'?pgDashboard:pgFDash);
  root.innerHTML=layout(fn());
}

// ── INIT ───────────────────────────────
function init(){
  DB.init();
  const s=Auth.load();
  if(s){APP.user=s.user;APP.role=s.role;APP.pg='dashboard';}
  render();
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
